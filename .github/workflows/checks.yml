name: Verificación Django
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nuam_test
          POSTGRES_PASSWORD: ci-only-ephemeral
          POSTGRES_DB: nuam_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SECRET_KEY: ci-only-key-not-for-deployment
      DEBUG: 'false'
      USE_SQLITE: 'false'
      DATABASE_URL: postgresql://nuam_test:ci-only-ephemeral@localhost:5432/nuam_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test core.tests --settings=config.test_settings -v 2
